      - generic [ref=e114]:
        - heading "近期更新" [level=3] [ref=e115]
        - list [ref=e116]:
          - listitem [ref=e117]: 料理与食谱支持预览功能，可在列表点击「预览」按钮查看料理和食谱的详细信息
          - listitem [ref=e118]: 允许在 Mission 中设计「和角色交谈(TalkWithCharacter)」类型的完成条件
          - listitem [ref=e119]: 对话编辑器中允许设计对话「选项分支」、「跳转」、和「结束」
          - listitem [ref=e120]: 允许在 Mission 中设计「还债(BillRepayment)」类型的完成条件
          - listitem [ref=e121]: 对话编辑器中的 CG/BG/音效选择 新增资产管理器浏览按钮，点击可打开弹窗以选择资产文件。
          - listitem [ref=e122]: 角色列表增加特殊顾客「秦心」
          - listitem [ref=e123]: 允许在 Mission 中设计「交付包含食材的料理(SubmitByIngredients)」、「交付包含其中任意一个Tag的对应物品(SubmitByAnyOneTag)」和「达到目标角色的羁绊等级LV(ReachTargetCharacterKisunaLevel)」类型的完成条件
          - listitem [ref=e124]: 重构资产浏览器，允许自由编辑资产
          - listitem [ref=e125]: 添加长页面回顶按钮，滚动超过一定高度时显示
          - listitem [ref=e126]: 添加列表页折叠功能，支持角色、料理、酒水、原料、任务和事件等列表
          - listitem [ref=e127]: 修复任务节点、事件节点列表的文本溢出和居中对齐问题
          - listitem [ref=e128]: 统一修复 Select 下拉菜单过宽及删除按钮错位问题，优化长文本显示。
          - listitem [ref=e129]: 允许为自定义稀客增加 hideInAlbum isParticular isCollabCharacter 配置项
          - listitem [ref=e130]: 允许在 Event 中设计「和角色对话时(OnTalkWithCharacter)」类型的条件触发器
          - listitem [ref=e131]: 允许设置原料前缀(Prefix)废案，如需启用，请安装 https://github.com/MetaMystia/PreFix 模组
          - listitem [ref=e132]: 修复资产页面音频分类的空状态文案，现已与「上传音频」按钮保持一致。
          - listitem [ref=e133]: 许可证不再写入 ResourceEx.json，仅保存在压缩包内的 LICENSE.md 中；编辑器会忽略 packInfo.license 字段。
          - listitem [ref=e134]: 新增顶部公告按钮，可从 GitHub 按钮旁随时重新打开公告。
          - listitem [ref=e135]: 修复设计系统运行时导出问题，稳定 cn、Dropdown、Popover 在生产构建中的行为。
          - listitem [ref=e136]: 将多个原生下拉框替换为统一 Select 组件，改善深色主题下的选择体验。
          - listitem [ref=e137]: 抽取通用标签组件 TagButton、TagSelector、TagsField，复用到酒水、料理、原料和任务条件编辑。
          - listitem [ref=e138]: 公告弹窗已支持按版本首次访问自动展示，关闭后会记录已读版本。
          - listitem [ref=e139]: 导航下拉项改用 Next Link，切换页面时不再清空已加载资源包数据。
          - listitem [ref=e140]: 资源包 Label 会校验合法字符，并在导出前阻止无效 Label。
